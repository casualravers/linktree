name: Vider le bucket doodles

on:
  schedule:
    # 12h à Paris en été (10h UTC). En hiver, ce passage tombe à 11h à Paris.
    # Pas de condition sur l'heure : GitHub peut lancer la tâche en retard, le vidage doit quand même avoir lieu.
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  vider:
    runs-on: ubuntu-latest
    steps:
      - name: Vider le bucket
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          API="$SUPABASE_URL/storage/v1"
          while true; do
            NAMES=$(curl -fsS -X POST \
              -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
              -H "apikey: $SUPABASE_SERVICE_KEY" \
              -H "Content-Type: application/json" \
              -d '{"prefix":"","limit":1000,"offset":0}' \
              "$API/object/list/doodles" | jq -r '.[].name')
            [ -z "$NAMES" ] && break
            BODY=$(printf '%s\n' "$NAMES" | jq -R -s -c 'split("\n") | map(select(. != "")) | {prefixes: .}')
            curl -fsS -X DELETE \
              -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
              -H "apikey: $SUPABASE_SERVICE_KEY" \
              -H "Content-Type: application/json" \
              -d "$BODY" \
              "$API/object/doodles" > /dev/null
          done
          echo "Bucket doodles vidé."
